spring.application.name=medinear
server.port=8081

# H2 Database Configuration (Zero setup required)
spring.datasource.url=jdbc:h2:file:./data/medineardb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=medinear-local-secret-key-2026-secure-32-chars-long-key
jwt.expiration=86400000


